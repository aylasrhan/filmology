name: filmology
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  go_router: ^17.0.1
  get_it: ^9.2.0
  flutter_easyloading: ^3.0.5
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  flutter_secure_storage: ^9.2.2
  youtube_player_flutter: ^9.1.3
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-Black.ttf
          weight: 900
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-ExtraBold.ttf
          weight: 800

    - family: NotoSans
      fonts:
        - asset: assets/fonts/noto_sans/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans/NotoSans-Bold.ttf
          weight: 700